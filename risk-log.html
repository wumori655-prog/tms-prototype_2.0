<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风控日志 · TMS</title>
<style>
  :root{
    --bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#1c2128;--bg-hover:#21262d;--bg-card:#1a1f26;
    --border:#30363d;--border-light:#3d444d;
    --text-primary:#e6edf3;--text-secondary:#8b949e;--text-muted:#6e7681;
    --accent-blue:#58a6ff;--accent-green:#3fb950;--accent-red:#f85149;--accent-orange:#d29922;--accent-purple:#a371f7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg-primary);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;}

  /* ===== 顶栏（新版：三组下拉） ===== */
  .top-nav{display:flex;align-items:center;height:52px;background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:0 16px;gap:4px;position:relative;z-index:100;}
  .top-nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;margin-right:14px;}
  .top-nav-logo-icon{width:24px;height:24px;border-radius:6px;background:var(--accent-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;}
  .top-nav-logo-text{color:var(--text-primary);font-weight:600;font-size:15px;}
  .top-nav-menu{display:flex;align-items:center;height:100%;gap:2px;}
  .top-nav-item{padding:0 13px;height:52px;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text-secondary);text-decoration:none;position:relative;cursor:pointer;white-space:nowrap;}
  .top-nav-item:hover{color:var(--text-primary);}
  .top-nav-item.active{color:var(--accent-blue);}
  .top-nav-item.active::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--accent-blue);}
  .top-nav-caret{font-size:10px;transition:transform .18s;}
  .top-nav-group{position:relative;display:flex;align-items:center;height:100%;}
  .top-nav{overflow:visible !important;}
.top-nav-dd{position:absolute;top:52px;left:6px;min-width:150px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:5px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:.16s;z-index:99999;box-shadow:0 8px 24px rgba(0,0,0,.45);}
  .top-nav-group.open .top-nav-dd{opacity:1;visibility:visible;transform:translateY(0);}
  .top-nav-group.open .top-nav-caret{transform:rotate(180deg);}
  .top-nav-dd a{display:block;padding:8px 12px;font-size:13px;color:var(--text-secondary);border-radius:6px;text-decoration:none;white-space:nowrap;}
  .top-nav-dd a:hover{background:var(--bg-hover);color:var(--text-primary);}
  .top-nav-dd a.cur{color:var(--accent-blue);background:rgba(88,166,255,.12);}
  .top-nav-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
  .top-nav-user{display:flex;align-items:center;gap:6px;}
  .top-nav-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .top-nav-username{font-size:12px;color:var(--text-secondary);}

  /* ===== 页面骨架 ===== */
  .page-container{display:flex;height:calc(100vh - 52px);}
  .side-nav{width:230px;flex-shrink:0;background:var(--bg-secondary);border-right:1px solid var(--border);padding:16px 0;overflow-y:auto;}
  .side-nav-header{padding:0 16px 14px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .side-nav-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .badge-admin{font-size:10px;color:var(--accent-orange);background:rgba(210,153,34,.15);border:1px solid rgba(210,153,34,.35);padding:1px 7px;border-radius:10px;font-weight:500;}
  .side-nav-subtitle{font-size:12px;color:var(--text-muted);margin-top:5px;line-height:1.6;}
  .side-stat{margin:0 12px 8px;padding:10px 12px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:8px;}
  .side-stat .k{font-size:11px;color:var(--text-muted);}
  .side-stat .v{font-size:20px;font-weight:600;margin-top:2px;}

  .main{flex:1;overflow-y:auto;padding:18px 22px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .page-head h1{font-size:17px;font-weight:600;}
  .page-head .sub{font-size:12px;color:var(--text-muted);margin-top:3px;}

  /* ===== 筛选栏 ===== */
  .filter-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;}
  .filter-group{display:flex;align-items:center;gap:6px;}
  .filter-group label{font-size:12px;color:var(--text-secondary);}
  select,input[type=text],input[type=date]{background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);border-radius:6px;padding:6px 9px;font-size:12px;outline:none;}
  select:focus,input:focus{border-color:var(--accent-blue);}
  .search-box{min-width:190px;}
  .btn{background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;}
  .btn:hover{border-color:var(--accent-blue);color:var(--text-primary);}
  .btn-reset{margin-left:auto;}

  /* ===== 日志表 ===== */
  .log-table{width:100%;border-collapse:collapse;background:var(--bg-secondary);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .log-table th{text-align:left;font-size:11px;color:var(--text-muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg-tertiary);white-space:nowrap;}
  .log-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle;}
  .log-row{cursor:pointer;}
  .log-row:hover{background:var(--bg-hover);}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;white-space:nowrap;}
  .st-open{color:var(--accent-orange);background:rgba(210,153,34,.15);}
  .st-closed{color:var(--text-secondary);background:rgba(139,148,158,.15);}
  .lv-crit{color:var(--accent-red);background:rgba(248,81,73,.2);font-weight:600;}
  .lv-high{color:var(--accent-red);background:rgba(248,81,73,.13);}
  .lv-mid{color:var(--accent-orange);background:rgba(210,153,34,.16);}
  .lv-low{color:var(--accent-blue);background:rgba(88,166,255,.16);}
  .type-txt{color:var(--text-primary);}
  .mono{font-family:ui-monospace,Menlo,monospace;}
  .bt-tag{font-size:10px;color:var(--accent-blue);background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.25);padding:1px 6px;border-radius:3px;margin-left:6px;}
  .muted{color:var(--text-muted);}
  .expand-ico{color:var(--text-muted);transition:transform .15s;display:inline-block;}
  .log-row.open .expand-ico{transform:rotate(90deg);}
  .detail-row td{background:var(--bg-tertiary);padding:0;border-bottom:1px solid var(--border);}
  .detail-wrap{padding:12px 16px;}
  .detail-title{font-size:11px;color:var(--text-muted);margin-bottom:8px;}
  .timeline-item{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:12px;}
  .tl-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .tl-trigger{background:var(--accent-red);}
  .tl-resolve{background:var(--accent-green);}
  .tl-time{color:var(--text-muted);font-size:11px;}
  .empty{text-align:center;color:var(--text-muted);padding:40px;font-size:13px;}
</style>
</head>
<body>
  <!-- ===== 顶栏（新版三组下拉，全站模板） ===== -->
  <nav class="top-nav">
    <a class="top-nav-logo" href="trading-list.html">
      <span class="top-nav-logo-icon">T</span><span class="top-nav-logo-text">TMS</span>
    </a>
    <div class="top-nav-menu" id="navMenu">
      <a class="top-nav-item" href="league-management.html">联赛管理</a>
      <div class="top-nav-group">
        <a class="top-nav-item" data-group>操盘管理 <span class="top-nav-caret">▾</span></a>
        <div class="top-nav-dd">
          <a href="trading-list.html">操盘列表</a>
          <a href="trading-detail.html">操盘详情</a>
        </div>
      </div>
      <div class="top-nav-group">
        <a class="top-nav-item active" data-group>风控管理 <span class="top-nav-caret">▾</span></a>
        <div class="top-nav-dd">
          <a href="risk-management.html">风控配置</a>
          <a class="cur" href="risk-log.html">风控日志</a>
        </div>
      </div>
      <div class="top-nav-group">
        <a class="top-nav-item" data-group>结算管理 <span class="top-nav-caret">▾</span></a>
        <div class="top-nav-dd">
          <a href="settlement-list.html">结算列表</a>
          <a href="settlement-detail.html">结算详情</a>
          <a href="settlement-report.html">结算报表</a>
        </div>
      </div>
    </div>
    <div class="top-nav-right">
      <div style="display:flex;align-items:center;gap:6px;padding-right:12px;border-right:1px solid var(--border);">
        <span style="width:6px;height:6px;background:var(--accent-green);border-radius:50%;"></span>
        <span style="font-size:11px;color:var(--text-secondary);">IM</span>
        <span style="font-size:10px;color:var(--text-muted);">23ms</span>
      </div>
      <div class="top-nav-user"><div class="top-nav-avatar">张</div><span class="top-nav-username">张主管</span></div>
    </div>
  </nav>

  <div class="page-container">
    <!-- 左侧栏 -->
    <aside class="side-nav">
      <div class="side-nav-header">
        <div class="side-nav-title">风控日志 <span class="badge-admin">主管专属</span></div>
        <div class="side-nav-subtitle">查询过往风控通知记录（触发 → 解除），含推送时间、推送人；可按操盘员筛选。</div>
      </div>
      <div class="side-stat"><div class="k">进行中（未解除）</div><div class="v" style="color:var(--accent-orange);" id="statOpen">—</div></div>
      <div class="side-stat"><div class="k">今日触发总数</div><div class="v" id="statTotal">—</div></div>
      <div class="side-stat"><div class="k">高危级</div><div class="v" style="color:var(--accent-red);" id="statP0">—</div></div>
    </aside>

    <!-- 主区 -->
    <main class="main">
      <div class="page-head">
        <div>
          <h1>风控日志</h1>
          <div class="sub">仅主管 / 风控可见 · 操盘员无权查看</div>
        </div>
        <button class="btn" onclick="exportCsv()">⬇ 导出 CSV</button>
      </div>

      <!-- 筛选栏 -->
      <div class="filter-bar">
        <div class="filter-group"><label>操盘员</label>
          <select id="fOperator" onchange="render()">
            <option value="">全部</option><option>张三</option><option>李四</option><option>王五</option>
          </select>
        </div>
        <div class="filter-group"><label>告警类型</label>
          <select id="fType" onchange="render()">
            <option value="">全部</option><option>单边超限</option><option>大额</option><option>延期超时</option><option>滚球未上架</option><option>数据源暂停</option><option>维护中</option><option>数据延迟</option><option>即将开赛未上架</option><option>比赛暂停</option><option>中立场</option>
          </select>
        </div>
        <div class="filter-group"><label>级别</label>
          <select id="fLevel" onchange="render()">
            <option value="">全部</option><option>高危</option><option>高</option><option>中</option><option>低</option>
          </select>
        </div>
        <div class="filter-group"><label>状态</label>
          <select id="fStatus" onchange="render()">
            <option value="">全部</option><option value="open">进行中</option><option value="closed">已解除</option>
          </select>
        </div>
        <div class="filter-group"><label>日期</label>
          <input type="date" id="fDate" value="2026-06-03" onchange="render()">
        </div>
        <div class="filter-group">
          <input type="text" class="search-box" id="fSearch" placeholder="搜索赛事 / 联赛 / 盘口BT…" oninput="render()">
        </div>
        <button class="btn btn-reset" onclick="resetFilters()">重置</button>
      </div>

      <table class="log-table">
        <thead>
          <tr>
            <th style="width:28px;"></th>
            <th>状态</th>
            <th>告警类型 · 级别</th>
            <th>关联赛事 · 盘口</th>
            <th>操盘员</th>
            <th>触发时间</th>
            <th>解除时间</th>
            <th>持续时长</th>
            <th>推送人</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
      <div class="empty" id="emptyHint" style="display:none;">无符合条件的记录</div>
    </main>
  </div>

<script>
// ===== 顶栏下拉（点击展开，点别处收起） =====
(function(){
  var groups = [].slice.call(document.querySelectorAll('.top-nav-group'));
  groups.forEach(function(g){
    g.querySelector('[data-group]').addEventListener('click', function(e){
      e.stopPropagation();
      var wasOpen = g.classList.contains('open');
      groups.forEach(function(x){ x.classList.remove('open'); });
      if(!wasOpen) g.classList.add('open');
    });
  });
  document.addEventListener('click', function(){ groups.forEach(function(x){ x.classList.remove('open'); }); });
})();

// ===== 风控日志数据（示例） =====
// 一条 = 一次风控事件生命周期（触发 → 解除）；推送可有多次（触发推送 / 解除推送）
var LOG = [
  { id:1, status:'open',   type:'单边超限',   level:'高危', league:'英超', match:'曼城 vs 利物浦', bt:'BT1',
    operator:'张三', trigger:'12:01:30', resolve:'', dur:'进行中',
    push:[{kind:'trigger',who:'系统'}] },
  { id:2, status:'closed', type:'大额',       level:'高危', league:'西甲', match:'巴萨 vs 皇马', bt:'BT3',
    operator:'李四', trigger:'11:40:10', resolve:'11:52:40', dur:'12分30秒',
    push:[{kind:'trigger',who:'系统'},{kind:'resolve',who:'系统（自动恢复）'}] },
  { id:3, status:'closed', type:'数据源暂停', level:'高',   league:'德甲', match:'拜仁 vs 多特', bt:'BT1',
    operator:'张三', trigger:'10:15:00', resolve:'10:18:20', dur:'3分20秒',
    push:[{kind:'trigger',who:'系统'},{kind:'resolve',who:'王主管（人工解除）'}] },
  { id:4, status:'open',   type:'数据延迟',   level:'中',   league:'J联赛', match:'浦和 vs 鹿岛', bt:'BT2',
    operator:'王五', trigger:'12:05:00', resolve:'', dur:'进行中',
    push:[{kind:'trigger',who:'系统'}] },
  { id:5, status:'closed', type:'比赛暂停',   level:'低',   league:'意甲', match:'尤文 vs AC米兰', bt:'BT1',
    operator:'李四', trigger:'09:30:00', resolve:'09:41:15', dur:'11分15秒',
    push:[{kind:'trigger',who:'系统'},{kind:'resolve',who:'系统（自动恢复）'}] },
  { id:6, status:'closed', type:'滚球未上架', level:'高危', league:'英超', match:'阿森纳 vs 切尔西', bt:'BT5',
    operator:'张三', trigger:'08:50:00', resolve:'08:55:00', dur:'5分00秒',
    push:[{kind:'trigger',who:'系统'},{kind:'resolve',who:'张三（人工解除）'}] }
];

var openRows = {};

function lvClass(l){ return {'高危':'lv-crit','高':'lv-high','中':'lv-mid','低':'lv-low'}[l]||'lv-mid'; }
function pushSummary(p){
  return '<div>' + p.map(function(x){return x.who;}).join(' · ') + '</div>';
}

function rowHtml(r){
  var stCls = r.status==='open' ? 'st-open' : 'st-closed';
  var stTxt = r.status==='open' ? '进行中' : '已解除';
  var detail = r.push.map(function(p){
    var dotCls = p.kind==='trigger' ? 'tl-trigger' : 'tl-resolve';
    var label = p.kind==='trigger' ? '触发推送' : '解除推送';
    return '<div class="timeline-item"><span class="tl-dot '+dotCls+'"></span><div>'+label+' · '+p.who+'</div></div>';
  }).join('');
  var open = openRows[r.id];
  return ''+
   '<tr class="log-row '+(open?'open':'')+'" onclick="toggleRow('+r.id+')">'+
     '<td><span class="expand-ico">▸</span></td>'+
     '<td><span class="badge '+stCls+'">'+stTxt+'</span></td>'+
     '<td><span class="type-txt">'+r.type+'</span> <span class="badge '+lvClass(r.level)+'">'+r.level+'</span></td>'+
     '<td>'+r.league+' · '+r.match+'<span class="bt-tag">'+r.bt+'</span></td>'+
     '<td>'+r.operator+'</td>'+
     '<td class="mono">'+r.trigger+'</td>'+
     '<td class="mono">'+(r.resolve||'<span class="muted">—</span>')+'</td>'+
     '<td>'+(r.status==='open'?'<span class="st-open badge">进行中</span>':r.dur)+'</td>'+
     '<td>'+pushSummary(r.push)+'</td>'+
   '</tr>'+
   (open ? '<tr class="detail-row"><td></td><td colspan="8"><div class="detail-wrap"><div class="detail-title">推送记录（触发 → 解除）</div>'+detail+'</div></td></tr>' : '');
}

function currentList(){
  var op=val('fOperator'), ty=val('fType'), lv=val('fLevel'), st=val('fStatus'), q=val('fSearch').trim().toLowerCase();
  return LOG.filter(function(r){
    if(op && r.operator!==op) return false;
    if(ty && r.type!==ty) return false;
    if(lv && r.level!==lv) return false;
    if(st && r.status!==st) return false;
    if(q){ var hay=(r.league+r.match+r.bt).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
}
function val(id){ return document.getElementById(id).value; }

function render(){
  var list = currentList();
  document.getElementById('logBody').innerHTML = list.map(rowHtml).join('');
  document.getElementById('emptyHint').style.display = list.length ? 'none' : 'block';
  // 侧栏统计（按全量，不随筛选）
  document.getElementById('statOpen').textContent = LOG.filter(function(r){return r.status==='open';}).length;
  document.getElementById('statTotal').textContent = LOG.length;
  document.getElementById('statP0').textContent = LOG.filter(function(r){return r.level==='高危';}).length;
}
function toggleRow(id){ openRows[id]=!openRows[id]; render(); }
function resetFilters(){ ['fOperator','fType','fLevel','fStatus','fSearch'].forEach(function(id){document.getElementById(id).value='';}); render(); }
function exportCsv(){ alert('导出 CSV（演示）：将按当前筛选条件导出 '+currentList().length+' 条记录。'); }

render();
</script>
</body>
</html>
