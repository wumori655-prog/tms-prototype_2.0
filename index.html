<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS 操盘管理系统 · 原型</title>
<style>
  :root{--bg-primary:#0d1117;--bg-secondary:#161b22;--bg-hover:#1c2128;--border:#30363d;--text-primary:#e6edf3;--text-secondary:#8b949e;--text-muted:#6e7681;--accent-blue:#58a6ff;--accent-orange:#d29922;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg-primary);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;}
  .hero{padding:48px 24px 28px;text-align:center;border-bottom:1px solid var(--border);}
  .hero-logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;}
  .hero-logo-icon{width:36px;height:36px;border-radius:9px;background:var(--accent-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;}
  .hero-title{font-size:26px;font-weight:700;}
  .hero-sub{font-size:14px;color:var(--text-secondary);margin-top:8px;}
  .wrap{max-width:960px;margin:0 auto;padding:32px 24px 56px;}
  .group{margin-bottom:28px;}
  .group-title{font-size:13px;color:var(--text-muted);font-weight:600;margin-bottom:12px;padding-left:2px;letter-spacing:.5px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .card{display:block;background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;padding:18px 18px;text-decoration:none;color:inherit;transition:all .15s;}
  .card:hover{border-color:var(--accent-blue);background:var(--bg-hover);transform:translateY(-2px);}
  .card-icon{font-size:24px;margin-bottom:10px;}
  .card-name{font-size:15px;font-weight:600;margin-bottom:4px;}
  .card-file{font-size:11px;color:var(--text-muted);font-family:ui-monospace,Menlo,monospace;}
  .badge{display:inline-block;font-size:10px;color:var(--accent-orange);background:rgba(210,153,34,.15);border:1px solid rgba(210,153,34,.35);padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:middle;}
  .foot{text-align:center;color:var(--text-muted);font-size:12px;padding:0 24px 40px;}
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-logo"><span class="hero-logo-icon">T</span><span class="hero-title">TMS 操盘管理系统</span></div>
    <div class="hero-sub">原型导航 · 点击进入各模块</div>
  </div>

  <div class="wrap">
    <div class="group">
      <div class="group-title">联赛</div>
      <div class="grid">
        <a class="card" href="league-management.html"><div class="card-icon">🏆</div><div class="card-name">联赛管理</div><div class="card-file">league-management.html</div></a>
      </div>
    </div>

    <div class="group">
      <div class="group-title">操盘管理</div>
      <div class="grid">
        <a class="card" href="trading-list.html"><div class="card-icon">📋</div><div class="card-name">操盘列表</div><div class="card-file">trading-list.html</div></a>
        <a class="card" href="trading-detail.html"><div class="card-icon">📊</div><div class="card-name">操盘详情</div><div class="card-file">trading-detail.html</div></a>
      </div>
    </div>

    <div class="group">
      <div class="group-title">风控管理</div>
      <div class="grid">
        <a class="card" href="risk-management.html"><div class="card-icon">🛡️</div><div class="card-name">风控配置</div><div class="card-file">risk-management.html</div></a>
        <a class="card" href="risk-log.html"><div class="card-icon">📒</div><div class="card-name">风控日志</div><div class="card-file">risk-log.html</div></a>
      </div>
    </div>

    <div class="group">
      <div class="group-title">结算管理</div>
      <div class="grid">
        <a class="card" href="settlement-list.html"><div class="card-icon">🧾</div><div class="card-name">结算列表</div><div class="card-file">settlement-list.html</div></a>
        <a class="card" href="settlement-detail.html"><div class="card-icon">🔍</div><div class="card-name">结算详情</div><div class="card-file">settlement-detail.html</div></a>
        <a class="card" href="settlement-report.html"><div class="card-icon">📈</div><div class="card-name">结算报表 <span class="badge">待重新规划</span></div><div class="card-file">settlement-report.html</div></a>
      </div>
    </div>
  </div>

  <div class="foot">TMS 原型 · 内部使用</div>
</body>
</html>
